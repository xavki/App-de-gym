name: Android CI (sin secretos)

# VALIDACIÓN: compila y ejecuta los tests unitarios. NO firma, NO usa secretos ni entornos y NO publica la APK.
# No necesita el entorno «apk-signing» ni DEBUG_KEYSTORE_BASE64. La firma está en otro workflow
# (android-debug-apk.yml), desactivada por defecto: solo se lanza a mano desde master.
#
# Se ejecuta al hacer push a ramas review/** (el workflow que cuenta es el de esa propia rama, por eso no
# depende de master) y a mano. No se usa pull_request_target ni workflow_run.
on:
  push:
    branches:
      - "review/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compilar y probar (sin secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout del commit exacto
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirmar que se valida exactamente este commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
            echo "::error::HEAD ($ACTUAL) no coincide con el commit del evento ($EXPECTED_SHA)."
            exit 1
          fi
          git log -1 --format='commit %H%n%s'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.11.1"

      - name: Tests unitarios (JVM)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar (assembleDebug)
        run: gradle :app:assembleDebug --stacktrace

      - name: Resumen de tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r=ET.parse(p).getroot()
              t+=int(r.get("tests"));f+=int(r.get("failures"));e+=int(r.get("errors"));s+=int(r.get("skipped"))
          line=f"- Tests unitarios: total {t}, fallos {f}, errores {e}, omitidos {s}"
          print(line)
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(line+"\n")
          sys.exit(0 if t>0 and f==0 and e==0 else 1)
          PY

      - name: Publicar informes de tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore
